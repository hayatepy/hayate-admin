name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src examples tests typing_tests scripts/check_dist.py
      - run: uv run ruff format --check src examples tests typing_tests scripts/check_dist.py
      - run: uv run mypy src examples typing_tests
      - run: uv run pytest -q

  sqlite-example:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Compile SQLite contracts against migration history
        run: >-
          uv run hayate-sql check examples/sqlite/queries
          --dialect sqlite
          --migrations examples/sqlite/migrations
      - name: Verify generated facade is reproducible
        run: |
          uv run hayate-sql generate examples/sqlite/queries -o /tmp/generated_queries.py
          uv run ruff format /tmp/generated_queries.py
          diff -u examples/sqlite/generated_queries.py /tmp/generated_queries.py
      - run: uv run pytest tests/test_sqlite_example.py -q

  workerd-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate
          ref: edee05beb7f3e430f9477fb5e22fcdd55694d501
          path: _ecosystem/hayate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate-htmx
          ref: c133900998c487a44d40a103c52f2d469047deda
          path: _ecosystem/hayate-htmx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate-sql
          ref: 583591cb5d0a8b4ae75395117bc7ffc2c2bd29b9
          path: _ecosystem/hayate-sql
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: shellcheck scripts/check_workers_d1.sh
      - name: Prove native Workers and D1 compatibility
        run: bash scripts/check_workers_d1.sh
        env:
          HAYATE_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate
          HAYATE_HTMX_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate-htmx
          HAYATE_SQL_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate-sql

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv build
      - run: uv run python scripts/check_dist.py
      - run: uv run --with twine==6.2.0 twine check dist/*

  audit-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with pip-audit==2.10.0 pip-audit

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx zizmor==1.28.0 .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
