name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after validation
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  workerd-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate
          ref: edee05beb7f3e430f9477fb5e22fcdd55694d501
          path: _ecosystem/hayate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate-htmx
          ref: c133900998c487a44d40a103c52f2d469047deda
          path: _ecosystem/hayate-htmx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hayatepy/hayate-sql
          ref: 583591cb5d0a8b4ae75395117bc7ffc2c2bd29b9
          path: _ecosystem/hayate-sql
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - run: shellcheck scripts/check_workers_d1.sh
      - name: Prove native Workers and D1 compatibility
        run: bash scripts/check_workers_d1.sh
        env:
          HAYATE_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate
          HAYATE_HTMX_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate-htmx
          HAYATE_SQL_SOURCE_DIR: ${{ github.workspace }}/_ecosystem/hayate-sql

  build:
    needs: workerd-d1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked
      - name: Verify tag matches the package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          source_version="$(uv run python -c 'import hayate_admin; print(hayate_admin.__version__)')"
          test "${package_version}" = "${source_version}"
          case "${package_version}" in
            *dev*|*a*|*b*|*rc*) exit 1 ;;
          esac
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - run: uv run pytest -q
      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.10.0 pip-audit
      - run: uv build
      - run: uv run python scripts/check_dist.py
      - run: mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: release/sbom.spdx.json

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release/
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/* release/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
